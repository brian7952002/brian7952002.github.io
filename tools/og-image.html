<!doctype html>
<!-- Social preview card. Regenerate docs/assets/img/og.png with:
     chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=docs/assets/img/og.png tools/og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;font-family:"Space Grotesk",sans-serif;color:#0d1117;background:#f4f5f1;
    background-image:linear-gradient(rgba(13,17,23,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(13,17,23,.06) 1px,transparent 1px);background-size:32px 32px;
    display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;padding:0 64px}
  .tag{display:inline-flex;gap:8px;align-items:center;font-family:"JetBrains Mono";font-size:16px;padding:8px 12px;border:1px solid rgba(13,17,23,.14);border-radius:8px;background:#fff}
  .tag b{width:9px;height:9px;border-radius:50%;background:#12a862}
  h1{font-size:62px;white-space:nowrap;line-height:.98;letter-spacing:-.045em;margin:26px 0 22px}
  h1 span{background:linear-gradient(transparent 70%,#ff6a1a 70%,#ff6a1a 90%,transparent 90%)}
  .who{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .role{font-family:"JetBrains Mono";font-size:16px;color:#3b4250;margin-top:6px}
  .card{background:#fff;border:2px solid #0d1117;border-radius:18px;box-shadow:10px 10px 0 #0d1117;overflow:hidden}
  .bar{font-family:"JetBrains Mono";font-size:14px;padding:12px 16px;border-bottom:2px solid #0d1117;background:#fafaf7;display:flex;justify-content:space-between}
  svg{display:block;width:100%}
  .n rect{fill:#fff;stroke:#0d1117;stroke-width:1.5}.n text{font-family:"JetBrains Mono";font-size:12px}
  .e{fill:none;stroke:#0d1117;stroke-dasharray:4 5;opacity:.5}
</style>
</head>
<body>
  <div>
    <span class="tag"><b></b>brian7952002.github.io</span>
    <h1>Business needs in.<br><span>Working systems</span> out.</h1>
    <div class="who">Brian Skelton</div>
    <div class="role">Solutions Architect · Technical Consultant</div>
  </div>
  <div class="card">
    <div class="bar"><span>integration-map.svg</span><span style="color:#12a862">● live</span></div>
    <svg viewBox="0 0 440 300">
      <path class="e" d="M220 150 C170 150 150 60 100 60"/><path class="e" d="M220 150 C270 150 290 60 340 60"/>
      <path class="e" d="M220 150 C170 150 150 240 100 240"/><path class="e" d="M220 150 C270 150 290 240 340 240"/>
      <circle cx="160" cy="98" r="5" fill="#2b50ff"/><circle cx="286" cy="110" r="5" fill="#ff6a1a"/><circle cx="168" cy="210" r="5" fill="#12a862"/><circle cx="292" cy="202" r="5" fill="#2b50ff"/>
      <g class="n" transform="translate(30 38)"><rect width="130" height="44" rx="8"/><text x="12" y="27">Salesforce</text></g>
      <g class="n" transform="translate(280 38)"><rect width="130" height="44" rx="8"/><text x="12" y="27">Payroll</text></g>
      <g class="n" transform="translate(30 218)"><rect width="130" height="44" rx="8"/><text x="12" y="27">PostgreSQL</text></g>
      <g class="n" transform="translate(280 218)"><rect width="130" height="44" rx="8"/><text x="12" y="27">HCM / SSO</text></g>
      <g transform="translate(165 122)"><rect width="110" height="56" rx="10" fill="#0d1117"/><text x="55" y="33" fill="#fff" text-anchor="middle" font-family="JetBrains Mono" font-size="13" font-weight="600">WORKATO</text></g>
    </svg>
  </div>
</body>
</html>
