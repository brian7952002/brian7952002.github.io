<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Brian Skelton</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  .nf{min-height:100vh;display:grid;place-items:center;padding:16px}
  .nf .diagram{max-width:560px;width:100%}
  .nf .body{padding:28px}
  .nf h1{font-size:clamp(40px,8vw,72px);letter-spacing:-.045em;line-height:1}
  .nf p{color:var(--ink-2);margin:12px 0 24px}
</style>
</head>
<body>
<main class="nf">
  <div class="diagram">
    <div class="bar"><span>route-not-found.log</span><span style="color:var(--orange)">● 404</span></div>
    <div class="body">
      <h1>No route <span style="color:var(--orange)">mapped.</span></h1>
      <p>This page isn't wired to anything. Let's get you back to a working system.</p>
      <a class="b solid" href="/">← Back home</a>
    </div>
    <div class="log"><div><span class="t">--:--:--</span> <span style="color:#ff9b94">✗ GET</span> <span id="p"></span> · 404</div><div><span class="t">--:--:--</span> <span class="ok">✓ suggest</span> / → home</div></div>
  </div>
</main>
<script>document.getElementById('p').textContent=location.pathname</script>
</body>
</html>
